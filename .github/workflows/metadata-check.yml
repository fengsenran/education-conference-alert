name: 公开题录来源连通性检查
on:
  push:
    paths: ['diagnostics/metadata-probe.mjs', 'diagnostics/overseas-rss.mjs', 'diagnostics/publisher-probe.mjs', '.github/workflows/metadata-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node diagnostics/publisher-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-publisher-metadata-audit
          path: reports/publisher-probe/
          retention-days: 3
