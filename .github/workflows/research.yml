name: 每日基础教育论文与政策精选
on:
  push:
    paths: ['research.mjs', 'research.test.mjs', 'research-config.json', '.github/workflows/research.yml']
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run=仅检索；send=发送今日汇总'
        type: choice
        default: dry-run
        options: [dry-run, send]
permissions:
  contents: write
concurrency:
  group: education-wechat-daily
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 检查日期、每日计划和基础教育筛选规则
        run: node --test monitor.test.mjs research.test.mjs
      - name: 读取期刊与政府原始来源
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          MODE: ${{ github.event.inputs.mode || (github.event_name == 'schedule' && 'send' || 'dry-run') }}
        run: |
          if [ "$MODE" = 'send' ]; then
            node research.mjs
          else
            node research.mjs --dry-run
          fi
      - name: 保存文章与政策去重记录
        if: github.event_name == 'schedule' || inputs.mode == 'send'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research-state.json
          if [ -f archive/research-latest.md ]; then git add archive/research-latest.md archive/research-receipt.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update research digest delivery state'
            git push
          fi
      - name: 查看本轮精选与抓取范围
        if: always()
        run: |
          if [ -f reports/research-latest.md ]; then
            cat reports/research-latest.md >> "$GITHUB_STEP_SUMMARY"
          fi
