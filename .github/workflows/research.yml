name: 每日基础教育论文与政策精选
on:
  push:
    paths: ['research.mjs', 'research.test.mjs', 'research-profile.mjs', 'research-profile.test.mjs', 'journal-monitor.mjs', 'journal-monitor.test.mjs', 'journal-registry.json', 'research-config.json', '.github/workflows/research.yml']
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run=仅检索；send=发送今日汇总'
        type: choice
        default: dry-run
        options: [dry-run, send]
permissions:
  contents: write
concurrency:
  group: ${{ (github.event_name == 'schedule' || inputs.mode == 'send') && 'education-wechat-daily' || 'education-research-validation' }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 检查公共RSS云端连通性
        run: |
          node --input-type=module <<'JS'
          import dns from 'node:dns/promises';
          console.log('DNS', await dns.lookup('navi.cnki.net',{all:true}).catch(e=>({error:e.message})));
          for(const url of ['https://navi.cnki.net/knavi/rss/JYYJ','http://navi.cnki.net/knavi/rss/JYYJ']) {
            try {const r=await fetch(url,{signal:AbortSignal.timeout(12000)}); console.log(JSON.stringify({url,status:r.status,finalUrl:r.url,type:r.headers.get('content-type'),length:(await r.text()).length}));}
            catch(e) {console.log(JSON.stringify({url,error:e.message,cause:e.cause?.code,detail:e.cause?.message}));}
          }
          JS
      - run: node --test monitor.test.mjs research.test.mjs research-profile.test.mjs wechat-discovery.test.mjs journal-monitor.test.mjs
  collect:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {kind: zh, shard: 0, shards: 8}
          - {kind: zh, shard: 1, shards: 8}
          - {kind: zh, shard: 2, shards: 8}
          - {kind: zh, shard: 3, shards: 8}
          - {kind: zh, shard: 4, shards: 8}
          - {kind: zh, shard: 5, shards: 8}
          - {kind: zh, shard: 6, shards: 8}
          - {kind: zh, shard: 7, shards: 8}
          - {kind: en, shard: 0, shards: 2}
          - {kind: en, shard: 1, shards: 2}
          - {kind: news, shard: 0, shards: 4}
          - {kind: news, shard: 1, shards: 4}
          - {kind: news, shard: 2, shards: 4}
          - {kind: news, shard: 3, shards: 4}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 逐来源检索（不使用推送密钥）
        env:
          KIND: ${{ matrix.kind }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: node research.mjs --collect "$KIND" --shard "$SHARD" --shards "$SHARDS"
      - uses: actions/upload-artifact@v4
        with:
          name: collection-${{ matrix.kind }}-${{ matrix.shard }}
          path: reports/collect-${{ matrix.kind }}-${{ matrix.shard }}.json
          retention-days: 3
          if-no-files-found: error
  digest:
    needs: [test, collect]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: collection-*
          path: reports/collected
          merge-multiple: true
      - name: 合并检索、筛选及按计划推送
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          MODE: ${{ github.event.inputs.mode || (github.event_name == 'schedule' && 'send' || 'dry-run') }}
        run: |
          if [ "$MODE" = 'send' ]; then
            node research.mjs --assemble reports/collected
          else
            node research.mjs --assemble reports/collected --dry-run
          fi
      - name: 保存去重、缓存及覆盖记录
        if: github.event_name == 'schedule' || inputs.mode == 'send'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research-state.json paper-cache.json
          if [ -f archive/research-latest.md ]; then git add archive/research-latest.md archive/research-receipt.json archive/journal-coverage.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update research digest and source coverage'
            git push
          fi
      - name: 在运行摘要查看完整结果
        if: always()
        run: |
          if [ -f reports/research-latest.md ]; then cat reports/research-latest.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digest-preview
          path: |
            reports/research-latest.*
            reports/journal-coverage.json
          retention-days: 3
